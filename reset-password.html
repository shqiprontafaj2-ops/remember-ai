<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember AI - New Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .password-container { position: relative; }
        .password-container i { position: absolute; right: 12px; top: 52%; transform: translateY(-50%); cursor: pointer; color: #777; }
        button { margin-top: 25px; width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Set New Password</h2>
    <form id="resetForm" onsubmit="handleResetPassword(event)">
        <label for="newPassword">New Password:</label>
        <div class="password-container">
            <input type="password" id="newPassword" placeholder="Enter new password" required>
            <i class="fa-solid fa-eye" id="togglePassword" onclick="toggleVis('newPassword', 'togglePassword')"></i>
        </div>

        <button type="submit">Update Password</button>
    </form>
</div>

<script>
    function toggleVis(fieldId, iconId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (field.type === "password") {
            field.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            field.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    async function handleResetPassword(event) {
        event.preventDefault();
        const email = localStorage.getItem('resetEmail');
        const newPassword = document.getElementById('newPassword').value;

        if (!email) {
            alert('No email found for password reset. Please start over.');
            window.location.href = 'forgot-password.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:5000/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, newPassword })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Password updated successfully! You can now log in.');
                localStorage.removeItem('resetEmail');
                window.location.href = 'login.html';
            } else {
                alert('Error: ' + (data.error || 'Failed to update password'));
            }
        } catch (err) {
            console.error('Network error:', err);
            alert('Failed to connect to the server.');
        }
    }
</script>

</body>
</html>
