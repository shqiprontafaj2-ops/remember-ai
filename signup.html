<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember AI - Create Account</title>
    <!-- Lidhja me skedarin tuaj të stilit (përshtateni emrin nëse është i ndryshëm, p.sh. style.css) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signup-container">
        <h2>Create Account</h2>
        
        <form id="signupForm">
            <div class="name-group">
                <div class="input-field">
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div class="input-field">
                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
            </div>

            <div class="input-field">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-field">
                <label for="country">Country:</label>
                <select name="country" id="country" required>
                    <option value="">Select your country</option>
                </select>
            </div>

            <div class="input-field">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="input-field">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="input-field">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-field">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn-submit">Sign Up</button>
        </form>
    </div>

    <!-- Skripti për të mbushur automatikisht të gjitha shtetet e botës dhe për të dërguar të dhënat në backend -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const countrySelect = document.getElementById("country");
            
            // Mbushja automatike e shteteve
            if (countrySelect) {
                fetch("https://restcountries.com/v3.1/all?fields=name")
                    .then(response => response.json())
                    .then(data => {
                        data.sort((a, b) => a.name.common.localeCompare(b.name.common));
                        
                        data.forEach(country => {
                            const option = document.createElement("option");
                            option.value = country.name.common;
                            option.textContent = country.name.common;
                            countrySelect.appendChild(option);
                        });
                    })
                    .catch(error => console.error("Gabim në marrjen e shteteve:", error));
            }

            // Trajtimi i dërgimit të formularit në backend
            const signupForm = document.getElementById("signupForm");
            if (signupForm) {
                signupForm.addEventListener("submit", async function(e) {
                    e.preventDefault();
                    
                    const password = document.getElementById("password").value;
                    const confirmPassword = document.getElementById("confirm_password").value;

                    if (password !== confirmPassword) {
                        alert("Fjalëkalimet nuk përputhen!");
                        return;
                    }

                    const formData = {
                        first_name: document.getElementById("first_name").value,
                        last_name: document.getElementById("last_name").value,
                        email: document.getElementById("email").value,
                        country: document.getElementById("country").value,
                        phone: document.getElementById("phone").value,
                        dob: document.getElementById("dob").value,
                        password: password
                    };

                    try {
                        const response = await fetch('/api/signup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(formData)
                        });

                        const result = await response.json();
                        if (result.success) {
                            alert("U regjistruat me sukses!");
                            window.location.href = '/login.html';
                        } else {
                            alert("Gabim: " + result.message);
                        }
                    } catch (err) {
                        console.error("Gabim në rrjet:", err);
                        alert("Ndodhi një gabim gjatë regjistrimit.");
                    }
                });
            }
        });
    </script>
</body>
</html>
