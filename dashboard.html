<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember AI - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 650px;
            width: 100%;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin: 20px auto;
            color: #f8fafc;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
        }
        .header h2 span {
            color: #38bdf8;
        }
        .btn-logout {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.3s;
        }
        .btn-logout:hover {
            background-color: #dc2626;
        }
        h3 {
            color: #e2e8f0;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 5px;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            transform: translateY(-1px);
        }
        hr {
            border: 0;
            border-top: 1px solid #334155;
            margin: 25px 0;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h2>Welcome, <span id="userEmailDisplay"></span></h2>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <!-- Seksioni i Provimeve -->
    <h3>Schedule an Exam</h3>
    <form id="examForm" onsubmit="handleExam(event)">
        <div class="form-group">
            <label for="examTitle">Exam Title</label>
            <input type="text" id="examTitle" placeholder="e.g., Mathematics Final" required>
        </div>
        <div class="form-group">
            <label for="examDate">Exam Date & Time</label>
            <input type="datetime-local" id="examDate" required>
        </div>
        <button type="submit" class="btn-submit">Save Exam</button>
    </form>

    <hr>

    <!-- Seksioni i Takimeve -->
    <h3>Schedule a Meeting</h3>
    <form id="meetingForm" onsubmit="handleMeeting(event)">
        <div class="form-group">
            <label for="meetingTitle">Meeting Title</label>
            <input type="text" id="meetingTitle" placeholder="e.g., Project Sync" required>
        </div>
        <div class="form-group">
            <label for="meetingDate">Meeting Date & Time</label>
            <input type="datetime-local" id="meetingDate" required>
        </div>
        <button type="submit" class="btn-submit">Save Meeting</button>
    </form>
</div>

<script>
    const userEmail = localStorage.getItem('userEmail');
    if (!userEmail) {
        window.location.href = '/login';
    } else {
        document.getElementById('userEmailDisplay').textContent = userEmail;
    }

    function logout() {
        localStorage.removeItem('userEmail');
        window.location.href = '/login';
    }

    async function handleExam(event) {
        event.preventDefault();
        const title = document.getElementById('examTitle').value;
        const examDate = document.getElementById('examDate').value;

        try {
            const response = await fetch('/api/exams', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, title, examDate })
            });

            const result = await response.json();
            if (response.ok) {
                alert('Exam saved successfully and notification scheduled!');
                document.getElementById('examForm').reset();
            } else {
                alert('Error: ' + result.error);
            }
        } catch (error) {
            console.error('Network error:', error);
            alert('Failed to connect to the server.');
        }
    }

    async function handleMeeting(event) {
        event.preventDefault();
        const title = document.getElementById('meetingTitle').value;
        const meetingDate = document.getElementById('meetingDate').value;

        try {
            const response = await fetch('/api/meetings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userEmail, title, meetingDate })
            });

            const result = await response.json();
            if (response.ok) {
                alert('Meeting saved successfully and notification scheduled!');
                document.getElementById('meetingForm').reset();
            } else {
                alert('Error: ' + result.error);
            }
        } catch (error) {
            console.error('Network error:', error);
            alert('Failed to connect to the server.');
        }
    }
</script>

</body>
</html> .
