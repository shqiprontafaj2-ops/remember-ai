<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember AI - Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { margin-top: 25px; width: 100%; padding: 12px; background-color: #ffc107; color: #333; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #e0a800; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #007bff; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Reset Password</h2>
    <form id="forgotForm" onsubmit="handleForgotPassword(event)">
        <label for="email">Enter your registered email:</label>
        <input type="email" id="email" placeholder="name@example.com" required>
        <button type="submit">Send Reset Link</button>
    </form>
    <div class="link">
        Remembered your password? <a href="login.html">Login</a>
    </div>
</div>

<script>
    async function handleForgotPassword(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;

        try {
            const response = await fetch('http://localhost:5000/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (response.ok) {
                alert('If this email exists, a reset link has been simulated. Redirecting to reset page...');
                // Ruajmë email-in përkohësisht që të përdoret te faqja e re e fjalëkalimit
                localStorage.setItem('resetEmail', email);
                window.location.href = 'reset-password.html';
            } else {
                alert('Error: ' + (data.error || 'Something went wrong'));
            }
        } catch (err) {
            console.error('Network error:', err);
            alert('Failed to connect to the server.');
        }
    }
</script>

</body>
</html>
